<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Web Vitals observer</title><style>body{font-family:system-ui;max-width:52rem;margin:auto;padding:2rem}.hero{font-size:3rem}.shift{margin-top:8rem}output{display:block;white-space:pre-wrap;background:#eee;padding:1rem}</style></head><body>
<h1 class="hero">Core Web Vitals measurement</h1><button id="interact">操作してINPを測る</button><button id="shift">レイアウトシフトを発生 (約1.2秒後)</button><p id="shiftStatus"></p><output id="metrics">waiting...</output><div class="shift">観察対象</div>
<script type="module">
const state={LCP:null,CLS:0,INP:null};const out=document.querySelector('#metrics');const render=()=>out.textContent=JSON.stringify(state,null,2);render();
const supported=PerformanceObserver.supportedEntryTypes||[];
if(supported.includes('largest-contentful-paint'))new PerformanceObserver(list=>{for(const e of list.getEntries())state.LCP=Math.round(e.startTime);render()}).observe({type:'largest-contentful-paint',buffered:true});
if(supported.includes('layout-shift'))new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)state.CLS=Number((state.CLS+e.value).toFixed(4));render()}).observe({type:'layout-shift',buffered:true});
if(supported.includes('event'))new PerformanceObserver(list=>{for(const e of list.getEntries())state.INP=Math.max(state.INP||0,Math.round(e.duration));render()}).observe({type:'event',buffered:true,durationThreshold:16});
document.querySelector('#interact').addEventListener('click',()=>{const end=performance.now()+35;while(performance.now()<end){};render()});document.querySelector('#shift').addEventListener('click',()=>{const status=document.querySelector('#shiftStatus');status.textContent='約1.2秒後にシフトします (直後のシフトは hadRecentInput 扱いで CLS に入らないため)';setTimeout(()=>{document.querySelector('.shift').style.marginTop=Math.random()>.5?'1rem':'10rem';status.textContent='シフトしました';},1200);});
window.__webVitals=state;
</script></body></html>
