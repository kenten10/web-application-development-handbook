<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanilla Todo</title><style>body{font-family:system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem}li{display:flex;gap:.5rem;align-items:center}.completed span{text-decoration:line-through;color:#666}[aria-pressed=true]{font-weight:bold}</style><body><main><h1>Todo</h1><form id="todo-form"><label for="todo-input">新しいTodo</label><input id="todo-input" autocomplete="off" required><button>追加</button></form><nav aria-label="Todoフィルター"><button type="button" data-filter="all">All</button><button type="button" data-filter="active">Active</button><button type="button" data-filter="completed">Completed</button></nav><p id="status" aria-live="polite"></p><ul id="todo-list"></ul></main><script type="module" src="./app.js"></script></body></html>
