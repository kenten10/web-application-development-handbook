<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レンダリングパイプライン計測 (starter)</title>
<style>
  body { font-family: system-ui; margin: 1rem; }
  #stage { position: relative; height: 420px; overflow: auto; border: 1px solid #aaa; }
  .item { position: relative; width: 8px; height: 8px; background: #2563eb; margin: 1px; }
  output { display: block; white-space: pre-wrap; background: #eee; padding: 1rem; margin-top: 1rem; }
  button { margin-right: .5rem; }
</style>
</head>
<body>
<h1>レンダリングパイプラインを計測する</h1>

<p>
  同じ「1000個の要素を動かす」処理を3通りで書き、リフローとリペイントがどこで起きるかを比べる。
  DevTools の Performance パネルで記録しながら各ボタンを押し、Layout と Paint の回数と所要時間を読み取る。
</p>

<button id="bad">Bad: 1件ずつ読み書き</button>
<button id="better">Better: 読みと書きを分ける</button>
<button id="best">Best: transform で合成のみ</button>
<button id="reset">リセット</button>

<div id="stage"></div>
<output id="log">計測結果がここに出る</output>

<script type="module">
const stage = document.querySelector('#stage');
const log = document.querySelector('#log');
const COUNT = 1000;

function build() {
  stage.replaceChildren(...Array.from({ length: COUNT }, () => {
    const el = document.createElement('div');
    el.className = 'item';
    return el;
  }));
}
build();

// 計測の枠。performance.mark / measure で囲むと Performance パネルの
// User Timing レーンに並び、Layout・Paint との前後関係を目で追える
function measure(label, fn) {
  performance.mark(`${label}:start`);
  fn();
  performance.mark(`${label}:end`);
  const entry = performance.measure(label, `${label}:start`, `${label}:end`);
  log.textContent += `\n${label}: ${entry.duration.toFixed(1)}ms`;
}

const items = () => [...stage.querySelectorAll('.item')];

// TODO(1) Bad: 1要素ごとに「レイアウト値を読む → スタイルを書く」を交互に行う。
//   offsetTop などを読むたびに、直前の書き込みを反映するためのレイアウトが強制される
//   (forced synchronous layout)。この形を意図的に書いて、Layout の回数を観察する。
document.querySelector('#bad').addEventListener('click', () => measure('bad', () => {
  // ここに実装する
}));

// TODO(2) Better: 先に全要素の値を読み切ってから、まとめて書く。
//   読みと書きを分けると、強制レイアウトが1回に減る。
document.querySelector('#better').addEventListener('click', () => measure('better', () => {
  // ここに実装する
}));

// TODO(3) Best: レイアウトを起こさないプロパティ (transform / opacity) だけで動かす。
//   Layout も Paint も走らず、合成 (Composite) だけで済むことを確認する。
document.querySelector('#best').addEventListener('click', () => measure('best', () => {
  // ここに実装する
}));

document.querySelector('#reset').addEventListener('click', () => {
  build();
  log.textContent = '計測結果がここに出る';
});
</script>
</body>
</html>
