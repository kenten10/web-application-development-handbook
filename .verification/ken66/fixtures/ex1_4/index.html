<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1.4 使用履歴の可視化 (検証用ダミーデータ)</title>
<style>
body{font-family:system-ui;max-width:56rem;margin:2rem auto;padding:0 1rem}
.warn{background:#fff4d6;border:1px solid #e0b000;padding:.75rem;border-radius:.4rem}
table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{border:1px solid #ccc;padding:.35rem .5rem;text-align:left}
.bar{fill:#2563eb}.label{font-size:11px}
nav a{margin-right:1rem}
</style>
</head>
<body>
<h1>課題1.4 使用履歴の可視化</h1>
<p class="warn" id="notice">表示しているのは KEN-66 検証専用のダミーデータです。実ブラウザ履歴は読み込みません。</p>

<h2>訪問時間の可視化</h2>
<svg id="chart" width="720" height="260" role="img" aria-label="ダミー使用履歴の滞在時間"></svg>

<h2>サイト分類</h2>
<table id="table"><thead><tr><th>サイト</th><th>分類</th><th>訪問回数</th><th>滞在(分)</th></tr></thead><tbody></tbody></table>

<h2>遷移方式の観察</h2>
<nav>
  <a id="to-static" href="./static.html">静的ページへ (Document リクエストあり)</a>
  <a id="to-spa" href="./spa.html">SPA ページへ</a>
</nav>

<script type="module">
const res = await fetch('./history.json');
const data = await res.json();
const entries = data.entries;
const svg = document.querySelector('#chart');
const max = Math.max(...entries.map((e) => e.minutes));
const barW = 80, gap = 8;
const ns = 'http://www.w3.org/2000/svg';
entries.forEach((e, i) => {
  const h = Math.round((e.minutes / max) * 190);
  const rect = document.createElementNS(ns, 'rect');
  rect.setAttribute('class', 'bar');
  rect.setAttribute('x', String(i * (barW + gap) + 4));
  rect.setAttribute('y', String(210 - h));
  rect.setAttribute('width', String(barW));
  rect.setAttribute('height', String(h));
  rect.dataset.site = e.site;
  svg.append(rect);
  const text = document.createElementNS(ns, 'text');
  text.setAttribute('class', 'label');
  text.setAttribute('x', String(i * (barW + gap) + 4));
  text.setAttribute('y', '228');
  text.textContent = e.site.replace('.localhost', '');
  svg.append(text);
  const value = document.createElementNS(ns, 'text');
  value.setAttribute('class', 'label');
  value.setAttribute('x', String(i * (barW + gap) + 4));
  value.setAttribute('y', String(205 - h));
  value.textContent = `${e.minutes}m`;
  svg.append(value);
});
const tbody = document.querySelector('#table tbody');
tbody.replaceChildren(...entries.map((e) => {
  const tr = document.createElement('tr');
  for (const v of [e.site, e.category, e.visits, e.minutes]) {
    const td = document.createElement('td');
    td.textContent = String(v);
    tr.append(td);
  }
  return tr;
}));
window.__ex14 = { bars: svg.querySelectorAll('rect').length, rows: tbody.children.length, dummyOnly: data.generatedFor === 'verification-only' };
</script>
</body>
</html>
