# プロジェクト名を固定する。省略すると Compose はディレクトリ名 (.devcontainer) を使うため、
# 別リポジトリの .devcontainer と同じ名前になり、無関係なコンテナを作り直してしまう (KEN-61)
name: handbook

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://handbook:handbook@postgres:5432/handbook
      REDIS_URL: redis://redis:6379
      PORT_BASE: "3000"
      TLS_KEY: /workspace/.verification/certs/localhost-key.pem
      TLS_CERT: /workspace/.verification/certs/localhost-cert.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: handbook
      POSTGRES_PASSWORD: handbook
      POSTGRES_DB: handbook
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handbook -d handbook"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
